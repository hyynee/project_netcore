services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "${SQLSERVER_ACCEPT_EULA:-Y}"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD to a strong password}"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - shopcore-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  shopcore-sqlserver:
